# Claude review — read-only. Runs the piv-review-pr skill against the PR
# and posts the review as a PR comment. Claude reads code and comments; it
# never writes to the branch (contents: read).
#
# Fires automatically when a PR is opened, and on demand when a trusted
# contributor comments `@claude-review`.
name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event_name == 'pull_request' || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@claude-review')
        && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read         # read-only — the reviewer never edits the branch
      pull-requests: write   # post the review as a comment
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude-review"
          track_progress: true
          prompt: |
            Review this pull request by following the piv-review-pr skill in
            .claude/skills/piv-review-pr/SKILL.md.

            Review the full diff against the base branch. Check correctness,
            security, error handling, test coverage, and CLAUDE.md compliance.

            Post the review as a single PR comment. Be specific — cite
            file:line for every finding. Do not modify any files; this is a
            read-only review.
          claude_args: |
            --max-turns 20
