# Codex deterministic trust pattern — the most constrained of the three.
# The workflow YAML owns every git operation: identity, branch, commit,
# push, and PR creation. The agent's ONLY job is to edit files. Nothing
# the agent does can change git history or open a PR on its own.
#
# Trigger: a trusted contributor comments `@codex-create <request>` on an issue.
name: Codex Create (Deterministic)

on:
  issue_comment:
    types: [created]

jobs:
  codex-create:
    if: |
      github.event_name == 'issue_comment'
      && !github.event.issue.pull_request
      && contains(github.event.comment.body, '@codex-create')
      && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- The YAML owns git. Step 1: identity. ---
      - name: Configure git identity
        run: |
          git config user.name "codex-bot"
          git config user.email "codex-bot@users.noreply.github.com"

      # --- The YAML owns git. Step 2: the branch. ---
      - name: Create working branch
        id: branch
        run: |
          BRANCH="codex/issue-${{ github.event.issue.number }}-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      # Pull the request text out of the comment (everything after the command).
      - name: Extract request
        id: request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          REQUEST="${COMMENT_BODY#*@codex-create}"
          {
            echo "text<<CODEX_EOF"
            echo "$REQUEST"
            echo "CODEX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      # --- The agent runs here. It ONLY edits files. ---
      # No git, no gh, no PR. The prompt says so and the steps below
      # (not the agent) do every git operation.
      - name: Run Codex (writes code only)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec --full-auto "$(cat <<'CODEX_PROMPT'
          Implement the following request by editing files in this repository.

          Request:
          ${{ steps.request.outputs.text }}

          Rules:
          - Read CLAUDE.md and the surrounding code before editing.
          - Edit files ONLY. Do NOT run git, do NOT commit, do NOT push,
            do NOT open a pull request — the CI workflow handles all of that.
          - Make the smallest correct change that satisfies the request.
          CODEX_PROMPT
          )"

      # --- The YAML owns git. Step 3: commit, push, PR. ---
      - name: Commit, push, and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex made no changes — nothing to commit."
            gh issue comment "${{ github.event.issue.number }}" \
              --body "Codex ran but produced no file changes for this request."
            exit 0
          fi

          git add -A
          git commit -m "codex: address issue #${{ github.event.issue.number }}"
          git push -u origin "${{ steps.branch.outputs.name }}"

          PR_URL=$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "Codex: issue #${{ github.event.issue.number }}" \
            --body "Generated by Codex (deterministic pattern) for #${{ github.event.issue.number }}. The agent wrote the code; this workflow committed and opened the PR. Closes #${{ github.event.issue.number }}" \
            --draft)

          gh issue comment "${{ github.event.issue.number }}" \
            --body "Codex opened a draft PR: $PR_URL"
